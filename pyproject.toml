[project]
name = "jev-gray-swan-arena-judges"
version = "0.1.0"
description = "Off-platform TypeSafe judges that mimic the Gray Swan Arena official judges"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "llm-security",
    "red-teaming",
    "evaluation",
    "ai-safety",
]
dependencies = [
    "typesafe-sdk>=0.5.7,<0.7",
]

[project.scripts]
jev-gray-swan-arena-judges = "jev_gray_swan_arena_judges.cli:main"

[dependency-groups]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/siddicky/jev-gray-swan-arena-judges"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jev_gray_swan_arena_judges"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
